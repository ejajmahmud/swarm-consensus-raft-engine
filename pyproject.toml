[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-consensus-raft-engine"
version = "0.1.0"
description = "Raft-inspired distributed leader election and state machine replication for autonomous LLM agent swarms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
swarm-consensus-raft-engine = "swarm_consensus_raft_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_consensus_raft_engine*"]
